<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta - Gestión Universitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css">
    <link rel="icon" type="image/png" href="assets/Images/favicon.png">
</head>
<body>
    <user-panel id="userPanelRoot"></user-panel>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts de Autenticación JWT -->
    <script src="assets/scripts/auth.js"></script>
    <script src="assets/scripts/components.js"></script>
    <script src="assets/scripts/auth-guard.js"></script>
    <script src="assets/scripts/config.js"></script>
    <script src="assets/scripts/utils.js?v=3"></script>
    <script src="assets/scripts/user.js?v=2"></script>

    <script>
        // Configuración de tabs para User
        const userTabs = [
            {
                id: 'personas', label: 'Personas', entity: 'Personas',
                tableId: 'userPersonasTable', bodyId: 'userPersonasTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-primary',
                buttonFunction: 'userLoadPersonas',
                headers: ['ID', 'Nombre', 'Documento', 'Correo', 'Teléfono', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'materias', label: 'Materias', entity: 'Materias',
                tableId: 'userMateriasTable', bodyId: 'userMateriasTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-success',
                buttonFunction: 'userLoadMaterias',
                headers: ['ID', 'Nombre', 'Créditos', 'Descripción', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'programas', label: 'Programas', entity: 'Programas',
                tableId: 'userProgramasTable', bodyId: 'userProgramasTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-info',
                buttonFunction: 'userLoadProgramas',
                headers: ['ID', 'Nombre', 'Tipo', 'Duración (Semestres)', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'instalaciones', label: 'Instalaciones', entity: 'Instalaciones',
                tableId: 'userInstalacionesTable', bodyId: 'userInstalacionesTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-warning',
                buttonFunction: 'userLoadInstalaciones',
                headers: ['ID', 'Nombre', 'Tipo', 'Piso', 'Capacidad', 'ID Bloque', 'ID Área', 'ID Estado', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'campus', label: 'Campus', entity: 'Campus',
                tableId: 'userCampusTable', bodyId: 'userCampusTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-secondary',
                buttonFunction: 'userLoadCampus',
                headers: ['ID', 'Nombre', 'Dirección', 'Descripción', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'roles', label: 'Roles', entity: 'Roles',
                tableId: 'userRolesTable', bodyId: 'userRolesTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-primary',
                buttonFunction: 'userLoadRoles',
                headers: ['ID', 'Nombre', 'Descripción', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'personas-roles', label: 'Persona-Rol', entity: 'PersonaRol',
                tableId: 'userPersonaRolTable', bodyId: 'userPersonaRolTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-info',
                buttonFunction: 'userLoadPersonaRol',
                headers: ['ID Persona', 'ID Rol', 'Creado', 'Actualizado']
            },
            {
                id: 'programas-materias', label: 'Programa-Materia', entity: 'ProgramaMateria',
                tableId: 'userProgramaMateriaTable', bodyId: 'userProgramaMateriaTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-success',
                buttonFunction: 'userLoadProgramaMateria',
                headers: ['ID Programa', 'ID Materia', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'asignacion', label: 'Asignación-Instalaciones', entity: 'AsignacionInstalaciones',
                tableId: 'userAsignacionInstalacionesTable', bodyId: 'userAsignacionInstalacionesTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-warning',
                buttonFunction: 'userLoadAsignacionInstalaciones',
                headers: ['ID', 'ID Instalación', 'ID Materia', 'Día', 'Hora Inicio', 'Hora Fin', 'ID Persona', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'bloques', label: 'Bloques', entity: 'Bloques',
                tableId: 'userBloquesTable', bodyId: 'userBloquesTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-primary',
                buttonFunction: 'userLoadBloques',
                headers: ['ID', 'Nombre', 'Descripción', 'ID Campus', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'areas', label: 'Áreas Funcionales', entity: 'AreasFuncionales',
                tableId: 'userAreasFuncionalesTable', bodyId: 'userAreasFuncionalesTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-success',
                buttonFunction: 'userLoadAreasFuncionales',
                headers: ['ID', 'Nombre', 'Descripción', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'horarios', label: 'Horarios Instalación', entity: 'HorariosInstalacion',
                tableId: 'userHorariosInstalacionTable', bodyId: 'userHorariosInstalacionTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-warning',
                buttonFunction: 'userLoadHorariosInstalacion',
                headers: ['ID', 'ID Instalación', 'Día', 'Hora Apertura', 'Hora Cierre', 'Estado', 'Creado', 'Actualizado']
            },
            {
                id: 'estados', label: 'Estados Instalación', entity: 'EstadoInstalacion',
                tableId: 'userEstadoInstalacionTable', bodyId: 'userEstadoInstalacionTableBody',
                buttonText: 'Recargar', buttonClass: 'btn-danger',
                buttonFunction: 'userLoadEstadoInstalacion',
                headers: ['ID', 'Nombre', 'Descripción', 'Estado', 'Creado', 'Actualizado']
            }
        ];

        // Establecer tabs y renderizar
        document.addEventListener('DOMContentLoaded', () => {
            const userPanel = document.getElementById('userPanelRoot');
            userPanel.setAttribute('tabs', JSON.stringify(userTabs));
        });
    </script>
</body>
</html>
