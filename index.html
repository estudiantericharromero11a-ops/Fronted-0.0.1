<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Enlace a la hoja de estilos de Bootstrap primero -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles/styles.css">
    <link rel="icon" type="image/png" href="assets/Images/favicon.png">
</head>
<body>

    <app-header page="login" title="Sistema Universitario"></app-header>


    <main>
        <div class="login-card">
            <!-- Tarjeta de login -->
            <section class="login-card">
                <header>
                    <h1>Bienvenido al Sistema</h1>
                    <p>Por favor, ingrese sus credenciales para continuar</p>
                </header>

                <form action="#" method="POST" id="loginForm">
                    <div class="field">
                        <label for="usuario" class="input_font">Usuario</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
                    </div>

                    <div class="field">
                        <label for="password" class="input_font">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" placeholder="********" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-primary btn-admin" id="loginBtn">Iniciar sesión</button>
                    </div>

                </form>

            </section>

        </div>
    </main>

    <app-footer></app-footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Scripts de Autenticación JWT -->
    <script src="assets/scripts/auth.js"></script>
    <script src="assets/scripts/components.js"></script>
    <script src="assets/scripts/login.js"></script>

</body>
</html>
